image:
  repository: ghcr.io/dijitalatolye/dijitalatolye-identity
  tag: latest

replicaCount: 2

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  hosts:
    - host: identity.dijitalatolye.tr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: identity-tls
      hosts:
        - identity.dijitalatolye.tr

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: OTEL_SERVICE_NAME
    value: identity-service

envFromSecrets:
  - name: identity-secrets

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
