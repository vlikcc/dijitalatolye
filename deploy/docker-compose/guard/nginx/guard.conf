# Guard reverse proxy + React SPA host (gorkemio/guard compose/nginx/guard.conf ile uyumlu).
# TLS: host seviyesinde (Caddy vb.) — bu container yalnizca HTTP.

upstream guard_web {
    server guard-web:8000;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 256m;

    location /admin/ {
        proxy_pass http://guard_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://guard_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /static/ {
        alias /var/lib/guard/staticfiles/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /metrics {
        proxy_pass http://guard_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
