# Guard reverse proxy + React SPA host (gorkemio/guard compose/nginx/guard.conf ile uyumlu).
# TLS: host seviyesinde (Caddy vb.) — bu container yalnizca HTTP.
#
# Docker ic DNS (127.0.0.11): upstream hostname'i startup'ta sabitlemeyip
# guard-web yeniden olusturuldugunda yeni IP'ye yonlendirir (502 onlemi).

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 256m;

    # Degisken proxy_pass — resolver ile birlikte guard-web IP degisiminde 502 olmaz.
    set $guard_backend guard-web:8000;

    location /admin/ {
        proxy_pass http://$guard_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://$guard_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /static/ {
        alias /var/lib/guard/staticfiles/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /metrics {
        proxy_pass http://$guard_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
