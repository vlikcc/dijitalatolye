      - "set -e\nmc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"\nmc mb -p local/${MINIO_BUCKET_CONTENT:-dijitalatolye-content} || true\nmc mb -p local/${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published} || true\nmc mb -p local/${MINIO_BUCKET_AVATARS:-dijitalatolye-avatars} || true\nmc anonymous set download local/${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published} || true\n# Servis basina en az yetkili kullanici: uygulamalar root kimligiyle baglanmaz.\n# policy create mevcut policy'yi gunceller; attach zaten bagliysa hata verir (|| true).\nsetup_user() {\n  printf '%s' \"$$3\" > /tmp/$$1.json\n  mc admin policy create local \"da-$$1\" /tmp/$$1.json\n  mc admin user add local \"$$2\" \"$$4\"\n  mc admin policy attach local \"da-$$1\" --user \"$$2\" >/dev/null 2>&1 || true\n}\nsetup_user storage \"$$MINIO_STORAGE_ACCESS_KEY\" \"{\\\"Version\\\":\\\"2012-10-17\\\",\\\"Statement\\\":[{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"s3:GetBucketLocation\\\",\\\"s3:ListBucket\\\"],\\\"Resource\\\":[\\\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}\\\",\\\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}\\\",\\\"arn:aws:s3:::${MINIO_BUCKET_AVATARS:-dijitalatolye-avatars}\\\"]},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"s3:GetObject\\\",\\\"s3:PutObject\\\",\\\"s3:DeleteObject\\\"],\\\"Resource\\\":[\\\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}/*\\\",\\\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}/*\\\",\\\"arn:aws:s3:::${MINIO_BUCKET_AVATARS:-dijitalatolye-avatars}/*\\\"]}]}\" \"$$MINIO_STORAGE_SECRET_KEY\"\nsetup_user content \"$$MINIO_CONTENT_ACCESS_KEY\" \"{\\\"Version\\\":\\\"2012-10-17\\\",\\\"Statement\\\":[{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"s3:GetBucketLocation\\\",\\\"s3:ListBucket\\\"],\\\"Resource\\\":[\\\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}\\\",\\\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}\\\"]},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"s3:GetObject\\\",\\\"s3:PutObject\\\",\\\"s3:DeleteObject\\\"],\\\"Resource\\\":[\\\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}/*\\\",\\\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}/*\\\"]},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"s3:GetBucketPolicy\\\",\\\"s3:PutBucketPolicy\\\"],\\\"Resource\\\":[\\\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}\\\"]}]}\" \"$$MINIO_CONTENT_SECRET_KEY\"\nsetup_user aimoderation \"$$MINIO_AIMODERATION_ACCESS_KEY\" \"{\\\"Version\\\":\\\"2012-10-17\\\",\\\"Statement\\\":[{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"s3:GetBucketLocation\\\",\\\"s3:ListBucket\\\"],\\\"Resource\\\":[\\\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}\\\",\\\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}\\\"]},{\\\"Effect\\\":\\\"Allow\\\",\\\"Action\\\":[\\\"s3:GetObject\\\"],\\\"Resource\\\":[\\\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}/*\\\",\\\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}/*\\\"]}]}\" \"$$MINIO_AIMODERATION_SECRET_KEY\"\necho 'MinIO buckets + service users ready.'\n"
    depends_on:
      minio:
        condition: "service_healthy"
        required: true
    entrypoint:
      - "/bin/sh"
      - "-c"
    environment:
      MINIO_AIMODERATION_ACCESS_KEY: "${MINIO_AIMODERATION_ACCESS_KEY:-svc-aimoderation}"
      MINIO_AIMODERATION_SECRET_KEY: "${MINIO_AIMODERATION_SECRET_KEY:?MINIO_AIMODERATION_SECRET_KEY is required (make prod-env)}"
      MINIO_CONTENT_ACCESS_KEY: "${MINIO_CONTENT_ACCESS_KEY:-svc-content}"
      MINIO_CONTENT_SECRET_KEY: "${MINIO_CONTENT_SECRET_KEY:?MINIO_CONTENT_SECRET_KEY is required (make prod-env)}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_STORAGE_ACCESS_KEY: "${MINIO_STORAGE_ACCESS_KEY:-svc-storage}"
      MINIO_STORAGE_SECRET_KEY: "${MINIO_STORAGE_SECRET_KEY:?MINIO_STORAGE_SECRET_KEY is required (make prod-env)}"
    image: "pgsty/mc:RELEASE.2026-09-16T00-00-00Z"
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "5m"
    networks:
      internal: null
    restart: "no"
  mongodb:
