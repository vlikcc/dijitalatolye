name: dijitalatolye-prod

include:
  - path: guard.stack.yml

# Production-grade self-hosted stack (single host, Docker Compose).
#
# Calistirma:
#   cp .env.prod.example .env.prod
#   # .env.prod icindeki tum SECRET'lari doldurun (POSTGRES_PASSWORD, JWT_SIGNING_KEY, vb.)
#   docker compose -f deploy/docker-compose/docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Public erisim sadece Caddy (80/443) uzerinden. Veri servisleri (PG/Redis/Mongo/ES/MinIO/RabbitMQ)
# host icindeki 127.0.0.1 portlarina bind edilir — disariya acik degil; sadece localden
# debug/backup icin erisilebilir.

x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  TZ: ${TZ:-Europe/Istanbul}
  DOTNET_RUNNING_IN_CONTAINER: "true"
  Database__AutoMigrate: "true"
  Jwt__Authority: http://identity:8080
  Jwt__Audience: ${JWT_AUDIENCE:-dijitalatolye-api}
  Jwt__RequireHttpsMetadata: "false"
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: /
  RabbitMq__Username: ${RABBITMQ_USER:-dijitalatolye}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
  Kestrel__Endpoints__Http__Url: http://+:8080
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

x-restart: &restart
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
      compress: "true"

x-app-defaults: &app-defaults
  <<: [*restart, *default-logging]
  networks: [internal]
  mem_limit: 768m
  mem_reservation: 256m
  cpus: 1.0
  # Tum .NET imajlari alpine tabanli (busybox wget mevcut); /health/live BuildingBlocks'ta map'li.
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 60s

x-data-defaults: &data-defaults
  <<: [*restart, *default-logging]
  networks: [internal]

services:
  # ============================================================
  # Reverse proxy + TLS termination
  # ============================================================
  caddy:
    image: caddy:2.8-alpine
    container_name: da-caddy
    depends_on:
      gateway: { condition: service_healthy }
      web: { condition: service_healthy }
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      # Let's Encrypt hesap e-postasi; localhost'ta kullanilmaz (Caddy internal CA) ama yine de dolu olmali
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required (gercek e-posta; lokal test icin ornegin admin@localhost.test)}
      # /cdn/* yalnizca bu bucket'a proxy'lenir (Caddyfile)
      MINIO_BUCKET_PUBLISHED: ${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Klasor baglanir: Caddyfile ortak site govdesini (site.caddy) import eder.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    <<: [*restart, *default-logging]

  # ============================================================
  # Infrastructure
  # ============================================================
  postgres:
    image: postgres:17-alpine
    container_name: da-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_MULTIPLE_DATABASES: identity,user,catalog,content,review,notification,analytics,audit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 256mb
    mem_limit: 2g
    <<: *data-defaults

  mongodb:
    image: mongo:7
    container_name: da-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-dijitalatolye}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: aimoderation
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 1536m
    <<: *data-defaults

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: da-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dijitalatolye}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 1g
    <<: *data-defaults

  redis:
    image: redis:7-alpine
    container_name: da-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 768m
    <<: *data-defaults

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: da-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    # Heap 512m (ES_JAVA_OPTS) + off-heap/page cache payi
    mem_limit: 1536m
    <<: *data-defaults

  minio:
    # Resmi minio/minio imaji Docker Hub/Quay'de artik public degil (MinIO Ekim 2025'te
    # community imaj yayinini durdurdu; anonim pull 401). Topluluk fork'u (pgsty, upstream
    # Dockerfile ile ayni: ubi9-micro + minio + mc + curl). Yukseltirken tag'i bilincli degistirin.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: da-minio
    # Konsol yalnizca 127.0.0.1:9001'de (public route YOK). Uzak sunucuda SSH tuneli:
    #   ssh -L 9001:127.0.0.1:9001 <sunucu>  ->  http://localhost:9001
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # Server imaji 'mc' icerir; 'local' alias'i varsayilan olarak http://localhost:9000
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    <<: *data-defaults

  minio-init:
    # Bkz. minio notu: resmi minio/mc imaji public degil; pgsty fork'u (/bin/sh mevcut)
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: da-minio-init
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_STORAGE_ACCESS_KEY: ${MINIO_STORAGE_ACCESS_KEY:-svc-storage}
      MINIO_STORAGE_SECRET_KEY: ${MINIO_STORAGE_SECRET_KEY:?MINIO_STORAGE_SECRET_KEY is required (make prod-env)}
      MINIO_CONTENT_ACCESS_KEY: ${MINIO_CONTENT_ACCESS_KEY:-svc-content}
      MINIO_CONTENT_SECRET_KEY: ${MINIO_CONTENT_SECRET_KEY:?MINIO_CONTENT_SECRET_KEY is required (make prod-env)}
      MINIO_AIMODERATION_ACCESS_KEY: ${MINIO_AIMODERATION_ACCESS_KEY:-svc-aimoderation}
      MINIO_AIMODERATION_SECRET_KEY: ${MINIO_AIMODERATION_SECRET_KEY:?MINIO_AIMODERATION_SECRET_KEY is required (make prod-env)}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p local/${MINIO_BUCKET_CONTENT:-dijitalatolye-content} || true
        mc mb -p local/${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published} || true
        mc mb -p local/${MINIO_BUCKET_AVATARS:-dijitalatolye-avatars} || true
        mc anonymous set download local/${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published} || true
        # Servis basina en az yetkili kullanici: uygulamalar root kimligiyle baglanmaz.
        # policy create mevcut policy'yi gunceller; attach zaten bagliysa hata verir (|| true).
        setup_user() {
          printf '%s' "$$3" > /tmp/$$1.json
          mc admin policy create local "da-$$1" /tmp/$$1.json
          mc admin user add local "$$2" "$$4"
          mc admin policy attach local "da-$$1" --user "$$2" >/dev/null 2>&1 || true
        }
        setup_user storage "$$MINIO_STORAGE_ACCESS_KEY" "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}\",\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}\",\"arn:aws:s3:::${MINIO_BUCKET_AVATARS:-dijitalatolye-avatars}\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}/*\",\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}/*\",\"arn:aws:s3:::${MINIO_BUCKET_AVATARS:-dijitalatolye-avatars}/*\"]}]}" "$$MINIO_STORAGE_SECRET_KEY"
        setup_user content "$$MINIO_CONTENT_ACCESS_KEY" "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}\",\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}/*\",\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}/*\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketPolicy\",\"s3:PutBucketPolicy\"],\"Resource\":[\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}\"]}]}" "$$MINIO_CONTENT_SECRET_KEY"
        setup_user aimoderation "$$MINIO_AIMODERATION_ACCESS_KEY" "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}\",\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::${MINIO_BUCKET_CONTENT:-dijitalatolye-content}/*\",\"arn:aws:s3:::${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}/*\"]}]}" "$$MINIO_AIMODERATION_SECRET_KEY"
        echo 'MinIO buckets + service users ready.'
    networks: [internal]
    restart: "no"
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  # MailHog: lokal prod testlerinde gercek SMTP yokken; uretimde profili etkinlestirmeyin.
  # Aktif etmek icin: --profile mailhog
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: da-mailhog
    profiles: ["mailhog"]
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal]
    <<: [*restart, *default-logging]

  # ============================================================
  # Application Services
  # ============================================================
  identity:
    build:
      context: ../..
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-identity:${IMAGE_TAG:-latest}
    container_name: da-identity
    depends_on:
      postgres:  { condition: service_healthy }
      rabbitmq:  { condition: service_healthy }
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=identity;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Audit:    Host=postgres;Port=5432;Database=audit;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JwtIssuer__Authority: http://identity:8080
      JwtIssuer__Audience: ${JWT_AUDIENCE:-dijitalatolye-api}
      JwtIssuer__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required (>= 32 chars)}
      JwtIssuer__AccessTokenLifetime: ${JWT_ACCESS_LIFETIME:-01:00:00}
      JwtIssuer__RefreshTokenLifetime: ${JWT_REFRESH_LIFETIME:-14.00:00:00}
      OAuth__Google__ClientId: ${GOOGLE_OAUTH_CLIENT_ID:-}
      OAuth__Google__ClientSecret: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Ilk admin: prod'da yalnizca ikisi de doluysa olusturulur (sifre >= 12 karakter)
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      # Sifirlama linki (dev loglama icin; e-postayi Notification gonderir)
      PasswordReset__UrlBase: https://${PUBLIC_DOMAIN:-localhost}/reset-password
      # Dogrulama/sifirlama token anahtarlari restart'lar arasinda korunur
      DataProtection__KeysPath: /app/dp-keys
    volumes:
      - identity-dpkeys:/app/dp-keys
    expose: ["8080"]
    <<: *app-defaults

  user:
    build:
      context: ../..
      dockerfile: src/Services/User/User.API/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-user:${IMAGE_TAG:-latest}
    container_name: da-user
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      identity: { condition: service_healthy }
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=user;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    expose: ["8080"]
    <<: *app-defaults

  catalog:
    build:
      context: ../..
      dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-catalog:${IMAGE_TAG:-latest}
    container_name: da-catalog
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=catalog;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
    expose: ["8080"]
    <<: *app-defaults

  storage:
    build:
      context: ../..
      dockerfile: src/Services/Storage/Storage.API/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-storage:${IMAGE_TAG:-latest}
    container_name: da-storage
    depends_on:
      minio-init: { condition: service_completed_successfully }
      guard-web:  { condition: service_healthy }
      rabbitmq:   { condition: service_healthy }
    environment:
      <<: *common-env
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_STORAGE_ACCESS_KEY:-svc-storage}
      Minio__SecretKey: ${MINIO_STORAGE_SECRET_KEY:?MINIO_STORAGE_SECRET_KEY is required}
      Minio__UseSsl: "false"
      Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-https://${PUBLIC_DOMAIN:-localhost}/cdn}
      Minio__BucketContent: ${MINIO_BUCKET_CONTENT:-dijitalatolye-content}
      Minio__BucketPublished: ${MINIO_BUCKET_PUBLISHED:-dijitalatolye-content-published}
      Minio__BucketAvatars: ${MINIO_BUCKET_AVATARS:-dijitalatolye-avatars}
      Guard__BaseUrl: http://guard-nginx
      Guard__SourceId: ${GUARD_SOURCE_ID:-dijitalatolye}
      Guard__Secret: ${GUARD_HMAC_SECRET:?GUARD_HMAC_SECRET is required}
      Guard__InboundSecret: ${GUARD_MAIN_SITE_HMAC_SECRET:-${GUARD_HMAC_SECRET}}
      Guard__CallbackBaseUrl: http://storage:8080
    expose: ["8080"]
    <<: *app-defaults

  content:
    build:
      context: ../..
      dockerfile: src/Services/Content/Content.API/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-content:${IMAGE_TAG:-latest}
    container_name: da-content
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=content;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_CONTENT_ACCESS_KEY:-svc-content}
      Minio__SecretKey: ${MINIO_CONTENT_SECRET_KEY:?MINIO_CONTENT_SECRET_KEY is required}
      Minio__UseSsl: "false"
      Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-https://${PUBLIC_DOMAIN:-localhost}/cdn}
      Catalog__BaseUrl: http://catalog:8080
      AiExtraction__DeepSeek__ApiKey: ${DEEPSEEK_API_KEY:-}
      AiExtraction__DeepSeek__Endpoint: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}/v1
      AiExtraction__DeepSeek__Model: ${DEEPSEEK_MODEL:-deepseek-chat}
    expose: ["8080"]
    <<: *app-defaults

  aimoderation:
    build:
      context: ../..
      dockerfile: src/Services/AIModeration/AIModeration.API/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-aimoderation:${IMAGE_TAG:-latest}
    container_name: da-aimoderation
    depends_on:
      mongodb:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      <<: *common-env
      ConnectionStrings__Mongo: mongodb://${MONGO_USER:-dijitalatolye}:${MONGO_PASSWORD}@mongodb:27017/aimoderation?authSource=admin
      Mongo__Database: ai_moderation
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_AIMODERATION_ACCESS_KEY:-svc-aimoderation}
      Minio__SecretKey: ${MINIO_AIMODERATION_SECRET_KEY:?MINIO_AIMODERATION_SECRET_KEY is required}
      Minio__UseSsl: "false"
      Llm__Provider: ${AIMODERATION_PROVIDER:-deepseek}
      Llm__DeepSeekApiKey: ${DEEPSEEK_API_KEY:-}
      Llm__DeepSeekModel: ${DEEPSEEK_MODEL:-deepseek-chat}
      Llm__DeepSeekEndpoint: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}/v1
      Llm__DeepSeekMaxTokens: ${DEEPSEEK_MAX_TOKENS:-2048}
      Llm__GeminiApiKey: ${GEMINI_API_KEY:-}
      Llm__GeminiModel: ${GEMINI_MODEL:-gemini-1.5-pro}
      Llm__AnthropicApiKey: ${ANTHROPIC_API_KEY:-}
      Llm__AnthropicModel: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
    expose: ["8080"]
    <<: *app-defaults

  review:
    build:
      context: ../..
      dockerfile: src/Services/Review/Review.API/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-review:${IMAGE_TAG:-latest}
    container_name: da-review
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=review;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    expose: ["8080"]
    <<: *app-defaults

  notification:
    build:
      context: ../..
      dockerfile: src/Services/Notification/Notification.API/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-notification:${IMAGE_TAG:-latest}
    container_name: da-notification
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=notification;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Smtp__Host: ${SMTP_HOST:-mailhog}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__UseSsl: ${SMTP_USE_SSL:-false}
      Smtp__Username: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM:-no-reply@dijitalatolye.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-DijitalAtolye}
      WebPush__PublicKey: ${WEBPUSH_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${WEBPUSH_PRIVATE_KEY:-}
      WebPush__Subject: ${WEBPUSH_SUBJECT:-mailto:admin@dijitalatolye.local}
      # E-posta linkleri: AppUrl + dogrulama {UrlBase}?email=...&token=...
      App__Url: https://${PUBLIC_DOMAIN:-localhost}
      EmailVerification__UrlBase: https://${PUBLIC_DOMAIN:-localhost}/verify-email
      # Sifre sifirlama e-postasi da Notification'dan gider: {UrlBase}?email=...&token=...
      PasswordReset__UrlBase: https://${PUBLIC_DOMAIN:-localhost}/reset-password
    expose: ["8080"]
    <<: *app-defaults

  analytics:
    build:
      context: ../..
      dockerfile: src/Services/Analytics/Analytics.API/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-analytics:${IMAGE_TAG:-latest}
    container_name: da-analytics
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      <<: *common-env
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=analytics;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    expose: ["8080"]
    <<: *app-defaults

  search:
    build:
      context: ../..
      dockerfile: src/Services/Search/Search.API/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-search:${IMAGE_TAG:-latest}
    container_name: da-search
    depends_on:
      elasticsearch: { condition: service_healthy }
      rabbitmq:      { condition: service_healthy }
    environment:
      <<: *common-env
      Elasticsearch__Uri: http://elasticsearch:9200
    expose: ["8080"]
    <<: *app-defaults

  admin:
    build:
      context: ../..
      dockerfile: src/Services/Admin/Admin.API/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-admin:${IMAGE_TAG:-latest}
    container_name: da-admin
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *common-env
      ConnectionStrings__Audit:    Host=postgres;Port=5432;Database=audit;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=audit;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DownstreamServices__ContentBaseUrl:    http://content:8080
      DownstreamServices__AnalyticsBaseUrl:  http://analytics:8080
      DownstreamServices__UserBaseUrl:       http://user:8080
      DownstreamServices__ModerationBaseUrl: http://aimoderation:8080
    expose: ["8080"]
    <<: *app-defaults

  gateway:
    build:
      context: ../..
      dockerfile: src/ApiGateway/Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-gateway:${IMAGE_TAG:-latest}
    container_name: da-gateway
    depends_on:
      identity:     { condition: service_healthy }
      user:         { condition: service_healthy }
      catalog:      { condition: service_healthy }
      storage:      { condition: service_healthy }
      content:      { condition: service_healthy }
      review:       { condition: service_healthy }
      notification: { condition: service_healthy }
      aimoderation: { condition: service_healthy }
      analytics:    { condition: service_healthy }
      search:       { condition: service_healthy }
      admin:        { condition: service_healthy }
    environment:
      <<: *common-env
      Cors__Origins: ${CORS_ORIGINS:-https://${PUBLIC_DOMAIN:-localhost}}
      ReverseProxy__Clusters__identity__Destinations__primary__Address: http://identity:8080
      ReverseProxy__Clusters__user__Destinations__primary__Address: http://user:8080
      ReverseProxy__Clusters__catalog__Destinations__primary__Address: http://catalog:8080
      ReverseProxy__Clusters__storage__Destinations__primary__Address: http://storage:8080
      ReverseProxy__Clusters__content__Destinations__primary__Address: http://content:8080
      ReverseProxy__Clusters__aimoderation__Destinations__primary__Address: http://aimoderation:8080
      ReverseProxy__Clusters__review__Destinations__primary__Address: http://review:8080
      ReverseProxy__Clusters__notification__Destinations__primary__Address: http://notification:8080
      ReverseProxy__Clusters__analytics__Destinations__primary__Address: http://analytics:8080
      ReverseProxy__Clusters__search__Destinations__primary__Address: http://search:8080
      ReverseProxy__Clusters__admin__Destinations__primary__Address: http://admin:8080
    expose: ["8080"]
    <<: *app-defaults

  web:
    # Angular v21 frontend (Faz 2 sonrası cutover)
    build:
      context: ../../src/Web/dijitalatolye-web-ng
      dockerfile: Dockerfile
    image: ${IMAGE_REPO:-dijitalatolye}-web:${IMAGE_TAG:-latest}
    container_name: da-web
    depends_on:
      gateway: { condition: service_healthy }
    expose: ["8080"]
    <<: *app-defaults
    # nginx'te /health/live yok; SPA kokunu kontrol et
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Gözlemlenebilirlik (opt-in): --profile observability ile baslar
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: da-prometheus
    profiles: [observability]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    <<: *data-defaults

  grafana:
    image: grafana/grafana:11.2.0
    container_name: da-grafana
    profiles: [observability]
    depends_on:
      prometheus: { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    <<: *data-defaults

  # guard.stack.yml servislerini prod internal agina bagla + restart/log rotasyonu/bellek limiti.
  # (YAML anchor'lari dosyalar arasi gecmez; anchor'lar bu dosyada tanimli oldugu icin burada uygulanir.)
  # Tek seferlik servisler (migrate/publisher) restart: "no" kalir — yalnizca log rotasyonu.
  guard-postgres:
    networks: [internal]
    mem_limit: 512m
    <<: [*restart, *default-logging]
  guard-redis:
    networks: [internal]
    mem_limit: 256m
    <<: [*restart, *default-logging]
  guard-clamav:
    networks: [internal]
    # clamd imza veritabanini bellege yukler (~1.5-2.5 GB, guncelleme sirasinda gecici 2x)
    mem_limit: 3g
    <<: [*restart, *default-logging]
  guard-migrate:
    networks: [internal]
    mem_limit: 512m
    <<: *default-logging
  guard-web:
    networks: [internal]
    mem_limit: 768m
    <<: [*restart, *default-logging]
  guard-worker-scan:
    networks: [internal]
    mem_limit: 1g
    <<: [*restart, *default-logging]
  guard-worker-delivery:
    networks: [internal]
    mem_limit: 512m
    <<: [*restart, *default-logging]
  guard-beat:
    networks: [internal]
    mem_limit: 256m
    <<: [*restart, *default-logging]
  guard-frontend-publisher:
    networks: [internal]
    mem_limit: 256m
    <<: *default-logging
  guard-static-publisher:
    networks: [internal]
    mem_limit: 256m
    <<: *default-logging
  guard-nginx:
    networks: [internal]
    mem_limit: 128m
    <<: [*restart, *default-logging]

volumes:
  postgres-data:
  identity-dpkeys:
  mongo-data:
  rabbitmq-data:
  redis-data:
  es-data:
  minio-data:
  caddy-data:
  prometheus-data:
  grafana-data:
  caddy-config:

networks:
  internal:
    driver: bridge
