# Observability stack (optional profile). Use with prod compose:
#   docker compose -f deploy/docker-compose/docker-compose.prod.yml \
#     -f deploy/docker-compose/docker-compose.observability.yml \
#     --env-file .env.prod --profile observability up -d

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: da-otel-collector
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
    networks: [internal]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: da-prometheus
    profiles: [observability]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: da-grafana
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [internal]
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  internal:
    external: true
    name: dijitalatolye-prod_internal
