<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>DijitalAtölye</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <meta name="theme-color" content="#0a1328" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Material+Icons&family=Material+Symbols+Outlined&display=swap"
    rel="stylesheet"
  />
  <script>
    // İlk boyamadan önce tema tercihini uygula (FOUC önleme)
    (function () {
      try {
        var t = localStorage.getItem('da-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <da-root>Yükleniyor…</da-root>
</body>
</html>
