server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # İçerik paketleri 50 MB'a kadar (Content.API BundleValidator) + multipart payı
    client_max_body_size 60m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Prod'da Caddy önde ve kendi başlıklarını ekler; full compose'da nginx doğrudan açık olduğu için burada da set edilir.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Angular'ın hash'li çıktıları (main-ABCD1234.js, chunk-XXXX.js, styles-XXXX.css, media/*-XXXX.woff2) — içerik değişince ad da değişir
    location ~* -[A-Z0-9]{8}\.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Hash'siz statik dosyalar (logo, da-sdk.js, sw-push.js, i18n) — kısa cache + revalidate
    location ~* \.(?:js|css|json|woff2?|svg|png|jpg|jpeg|gif|webp|avif|ico|txt|xml)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /hubs/ {
        proxy_pass http://gateway:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # SPA fallback — index.html asla cache'lenmez, böylece deploy sonrası yeni chunk adları hemen alınır
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
