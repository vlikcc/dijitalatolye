# Single-domain team preview. Uploaded games are disabled; bundled demos run
# in opaque-origin iframes. Mailpit is reachable only inside the Docker network.
x-env: &env
  NODE_ENV: production
  APP_URL: https://doa.gorkem.io
  DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:?required}@postgres:5432/dijital
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
  PREVIEW_SECRET: ${PREVIEW_SECRET:?required}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?required}
  BUNDLED_DEMO_ONLY: "true"
  DEMO_CATALOG_ENABLED: "true"
  STUDENT_LEARNING_ENABLED: "true"
  GAME_PROTOCOL: https
  DATA_DIR: /data
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  MAIL_FROM: Dijital Oyun Atölyesi <demo@doa.gorkem.io>
services:
  postgres:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: dijital
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U app -d dijital"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    environment:
      <<: *env
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD:?required}
      DEMO_CLASS_CODE: ${DEMO_CLASS_CODE:?required}
    command:
      [
        sh,
        -c,
        "pnpm db:migrate && pnpm seed && node --import tsx scripts/seed-team-demo.ts",
      ]
    volumes: [appdata:/data]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    environment: *env
    expose: ["3000"]
    volumes: [appdata:/data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.29.2
    restart: unless-stopped
volumes:
  pgdata:
  appdata:
